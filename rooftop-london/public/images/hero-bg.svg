<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22201D" />
      <stop offset="50%" stop-color="#181715" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#C8A66A" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#C8A66A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C8A66A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A66A" stop-opacity="0" />
      <stop offset="50%" stop-color="#C8A66A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C8A66A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGrad)" />
  <circle cx="960" cy="480" r="600" fill="url(#goldGlow)" />

  <!-- Elegant architectural framing -->
  <rect x="80" y="80" width="1760" height="920" fill="none" stroke="#C8A66A" stroke-opacity="0.15" stroke-width="1" rx="8" />
  <rect x="100" y="100" width="1720" height="880" fill="none" stroke="#C8A66A" stroke-opacity="0.08" stroke-width="1" rx="4" />

  <!-- Subtle luxury diamond motif -->
  <polygon points="960,340 980,360 960,380 940,360" fill="none" stroke="#C8A66A" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="600" y1="360" x2="940" y2="360" stroke="url(#goldLine)" stroke-width="1" />
  <line x1="980" y1="360" x2="1320" y2="360" stroke="url(#goldLine)" stroke-width="1" />
</svg>
