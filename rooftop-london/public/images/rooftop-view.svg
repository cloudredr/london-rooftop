<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="50%" stop-color="#1F1E1B" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A66A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C8A66A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C8A66A" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="600" cy="400" r="350" fill="url(#goldGlow)" />

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#C8A66A" stroke-opacity="0.3" stroke-width="1" rx="8" />
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="#C8A66A" stroke-opacity="0.1" stroke-width="1" rx="6" />

  <circle cx="600" cy="310" r="60" fill="#202020" stroke="#C8A66A" stroke-width="1.5" />
  <text x="600" y="318" font-family="'Playfair Display', Georgia, serif" font-size="16" letter-spacing="4" fill="#C8A66A" text-anchor="middle" font-weight="bold">ROOFTOP</text>

  <text x="600" y="430" font-family="'Playfair Display', Georgia, serif" font-size="34" letter-spacing="3" fill="#F7F5F0" text-anchor="middle" font-weight="600">OPEN SKY ROOFTOP DINING</text>
  <line x1="500" y1="465" x2="700" y2="465" stroke="#C8A66A" stroke-width="1.5" stroke-opacity="0.7" />
  <text x="600" y="510" font-family="'Inter', sans-serif" font-size="18" letter-spacing="1" fill="#A8A8A8" text-anchor="middle">Trisulia Skyline & Evening Breeze</text>

  <text x="600" y="710" font-family="'Inter', sans-serif" font-size="12" letter-spacing="3" fill="#C8A66A" stroke-opacity="0.7" text-anchor="middle">ROOFTOP LONDON • TRISULIA, CUTTACK</text>
</svg>
